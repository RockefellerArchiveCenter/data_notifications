[tox]
envlist = py312, linting
skipsdist = True

[testenv]
skip_install = True
deps =
  -rrequirements.txt
  -rtests/test_requirements.txt

[testenv:py312]
setenv =
  AWS_ROLE_ARN=arn:aws:iam::123456789012:role/digital-ingest-role #does a new AWS_ROLE_ARN need to be created for this?
  AWS_REGION=us-east-1
commands =
	coverage run -m pytest -s
	coverage report -m

[testenv:linting]
basepython = python3
deps = pre-commit
commands =
    pre-commit run --all-files

[flake8]
application-import-names = flake8
select = B, C, E, F, W, B950
import-order-style = pep8
max-complexity = 10
max-line-length = 160
ignore =
  # Line too long (82 > 79 characters).
	E501,
  # Blank line at end of file
	W391,